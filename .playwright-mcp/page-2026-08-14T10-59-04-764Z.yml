          - paragraph [ref=f3e1039]: 496 commands ship with the panel. Everything the web interface does, a shell script can do too.
      - paragraph [ref=f3e1040]: Lightweight and powerful control panel for the modern web
    - generic [ref=f3e1042]:
      - generic [ref=f3e1043]: What it runs
      - heading "One installer, the whole stack — configured and kept running." [level=2] [ref=f3e1044]
      - generic [ref=f3e1045]:
        - generic [ref=f3e1046]:
          - term [ref=f3e1047]: Web
          - definition [ref=f3e1048]: nginx + Apache 2
          - definition [ref=f3e1049]: nginx as reverse proxy, Apache with PHP-FPM behind it
        - generic [ref=f3e1050]:
          - term [ref=f3e1051]: PHP
          - definition [ref=f3e1052]: 5.6 through 8.2
          - definition [ref=f3e1053]: Multiple versions side by side, selectable per domain
        - generic [ref=f3e1054]:
          - term [ref=f3e1055]: Mail
          - definition [ref=f3e1056]: Exim · Dovecot · Roundcube
          - definition [ref=f3e1057]: POP, IMAP and SMTP with ClamAV, SpamAssassin and Sieve filters
        - generic [ref=f3e1058]:
          - term [ref=f3e1059]: DNS
          - definition [ref=f3e1060]: Bind 9
          - definition [ref=f3e1061]: Authoritative zones with clustering across servers
        - generic [ref=f3e1062]:
          - term [ref=f3e1063]: Databases
          - definition [ref=f3e1064]: MariaDB / MySQL · PostgreSQL
          - definition [ref=f3e1065]: Either or both, with phpMyAdmin and phpPgAdmin
        - generic [ref=f3e1066]:
          - term [ref=f3e1067]: Certificates
          - definition [ref=f3e1068]: Let's Encrypt
          - definition [ref=f3e1069]: Automatic issue and renewal, including wildcard certificates
        - generic [ref=f3e1070]:
          - term [ref=f3e1071]: Firewall
          - definition [ref=f3e1072]: iptables · fail2ban · ipset
          - definition [ref=f3e1073]: Brute-force detection and IP list management
    - generic [ref=f3e1075]:
      - generic [ref=f3e1076]:
        - generic [ref=f3e1077]: Requirements
        - list [ref=f3e1078]:
          - listitem [ref=f3e1079]:
            - generic [ref=f3e1081]: Debian
            - generic [ref=f3e1082]: 12 · 11 · 10
          - listitem [ref=f3e1083]:
            - generic [ref=f3e1085]: Ubuntu
            - generic [ref=f3e1086]: 22.04 LTS · 20.04 LTS
      - list [ref=f3e1087]:
        - listitem [ref=f3e1088]: 64-bit only — 32-bit operating systems are not supported.
        - listitem [ref=f3e1089]: Install on a fresh operating system, not alongside an existing stack.
        - listitem [ref=f3e1090]: On a VPS, prefer KVM or LXC. OpenVZ 7 and earlier have known DNS and firewall problems.
