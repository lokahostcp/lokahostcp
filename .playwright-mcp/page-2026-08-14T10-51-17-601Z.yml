          - paragraph [ref=f1e1039]: 496 commands ship with the panel. Everything the web interface does, a shell script can do too.
      - paragraph [ref=f1e1040]: Lightweight and powerful control panel for the modern web
    - generic [ref=f1e1042]:
      - generic [ref=f1e1043]: What it runs
      - heading "One installer, the whole stack — configured and kept running." [level=2] [ref=f1e1044]
      - generic [ref=f1e1045]:
        - generic [ref=f1e1046]:
          - term [ref=f1e1047]: Web
          - definition [ref=f1e1048]: nginx + Apache 2
          - definition [ref=f1e1049]: nginx as reverse proxy, Apache with PHP-FPM behind it
        - generic [ref=f1e1050]:
          - term [ref=f1e1051]: PHP
          - definition [ref=f1e1052]: 5.6 through 8.2
          - definition [ref=f1e1053]: Multiple versions side by side, selectable per domain
        - generic [ref=f1e1054]:
          - term [ref=f1e1055]: Mail
          - definition [ref=f1e1056]: Exim · Dovecot · Roundcube
          - definition [ref=f1e1057]: POP, IMAP and SMTP with ClamAV, SpamAssassin and Sieve filters
        - generic [ref=f1e1058]:
          - term [ref=f1e1059]: DNS
          - definition [ref=f1e1060]: Bind 9
          - definition [ref=f1e1061]: Authoritative zones with clustering across servers
        - generic [ref=f1e1062]:
          - term [ref=f1e1063]: Databases
          - definition [ref=f1e1064]: MariaDB / MySQL · PostgreSQL
          - definition [ref=f1e1065]: Either or both, with phpMyAdmin and phpPgAdmin
        - generic [ref=f1e1066]:
          - term [ref=f1e1067]: Certificates
          - definition [ref=f1e1068]: Let's Encrypt
          - definition [ref=f1e1069]: Automatic issue and renewal, including wildcard certificates
        - generic [ref=f1e1070]:
          - term [ref=f1e1071]: Firewall
          - definition [ref=f1e1072]: iptables · fail2ban · ipset
          - definition [ref=f1e1073]: Brute-force detection and IP list management
    - generic [ref=f1e1075]:
      - generic [ref=f1e1076]:
        - generic [ref=f1e1077]: Requirements
        - list [ref=f1e1078]:
          - listitem [ref=f1e1079]:
            - generic [ref=f1e1081]: Debian
            - generic [ref=f1e1082]: 12 · 11 · 10
          - listitem [ref=f1e1083]:
            - generic [ref=f1e1085]: Ubuntu
            - generic [ref=f1e1086]: 22.04 LTS · 20.04 LTS
      - list [ref=f1e1087]:
        - listitem [ref=f1e1088]: 64-bit only — 32-bit operating systems are not supported.
        - listitem [ref=f1e1089]: Install on a fresh operating system, not alongside an existing stack.
        - listitem [ref=f1e1090]: On a VPS, prefer KVM or LXC. OpenVZ 7 and earlier have known DNS and firewall problems.
