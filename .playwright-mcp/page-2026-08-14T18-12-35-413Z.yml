                    - paragraph [ref=e1039]: 496 commands ship with the panel. Everything the web interface does, a shell script can do too.
            - paragraph [ref=e1040]: Lightweight and powerful control panel for the modern web
        - generic [ref=e1042]:
            - generic [ref=e1043]: What it runs
            - heading "One installer, the whole stack — configured and kept running." [level=2] [ref=e1044]
            - generic [ref=e1045]:
                - generic [ref=e1046]:
                    - term [ref=e1047]: Web
                    - definition [ref=e1048]: nginx + Apache 2
                    - definition [ref=e1049]: nginx as reverse proxy, Apache with PHP-FPM behind it
                - generic [ref=e1050]:
                    - term [ref=e1051]: PHP
                    - definition [ref=e1052]: 5.6 through 8.2
                    - definition [ref=e1053]: Multiple versions side by side, selectable per domain
                - generic [ref=e1054]:
                    - term [ref=e1055]: Mail
                    - definition [ref=e1056]: Exim · Dovecot · Roundcube
                    - definition [ref=e1057]: POP, IMAP and SMTP with ClamAV, SpamAssassin and Sieve filters
                - generic [ref=e1058]:
                    - term [ref=e1059]: DNS
                    - definition [ref=e1060]: Bind 9
                    - definition [ref=e1061]: Authoritative zones with clustering across servers
                - generic [ref=e1062]:
                    - term [ref=e1063]: Databases
                    - definition [ref=e1064]: MariaDB / MySQL · PostgreSQL
                    - definition [ref=e1065]: Either or both, with phpMyAdmin and phpPgAdmin
                - generic [ref=e1066]:
                    - term [ref=e1067]: Certificates
                    - definition [ref=e1068]: Let's Encrypt
                    - definition [ref=e1069]: Automatic issue and renewal, including wildcard certificates
                - generic [ref=e1070]:
                    - term [ref=e1071]: Firewall
                    - definition [ref=e1072]: iptables · fail2ban · ipset
                    - definition [ref=e1073]: Brute-force detection and IP list management
        - generic [ref=e1075]:
            - generic [ref=e1076]:
                - generic [ref=e1077]: Requirements
                - list [ref=e1078]:
                    - listitem [ref=e1079]:
                        - generic [ref=e1081]: Debian
                        - generic [ref=e1082]: 12 · 11 · 10
                    - listitem [ref=e1083]:
                        - generic [ref=e1085]: Ubuntu
                        - generic [ref=e1086]: 22.04 LTS · 20.04 LTS
            - list [ref=e1087]:
                - listitem [ref=e1088]: 64-bit only — 32-bit operating systems are not supported.
                - listitem [ref=e1089]: Install on a fresh operating system, not alongside an existing stack.
                - listitem [ref=e1090]: On a VPS, prefer KVM or LXC. OpenVZ 7 and earlier have known DNS and firewall problems.
