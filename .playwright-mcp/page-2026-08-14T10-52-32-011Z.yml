          - paragraph [ref=f2e1039]: 496 commands ship with the panel. Everything the web interface does, a shell script can do too.
      - paragraph [ref=f2e1040]: Lightweight and powerful control panel for the modern web
    - generic [ref=f2e1042]:
      - generic [ref=f2e1043]: What it runs
      - heading "One installer, the whole stack — configured and kept running." [level=2] [ref=f2e1044]
      - generic [ref=f2e1045]:
        - generic [ref=f2e1046]:
          - term [ref=f2e1047]: Web
          - definition [ref=f2e1048]: nginx + Apache 2
          - definition [ref=f2e1049]: nginx as reverse proxy, Apache with PHP-FPM behind it
        - generic [ref=f2e1050]:
          - term [ref=f2e1051]: PHP
          - definition [ref=f2e1052]: 5.6 through 8.2
          - definition [ref=f2e1053]: Multiple versions side by side, selectable per domain
        - generic [ref=f2e1054]:
          - term [ref=f2e1055]: Mail
          - definition [ref=f2e1056]: Exim · Dovecot · Roundcube
          - definition [ref=f2e1057]: POP, IMAP and SMTP with ClamAV, SpamAssassin and Sieve filters
        - generic [ref=f2e1058]:
          - term [ref=f2e1059]: DNS
          - definition [ref=f2e1060]: Bind 9
          - definition [ref=f2e1061]: Authoritative zones with clustering across servers
        - generic [ref=f2e1062]:
          - term [ref=f2e1063]: Databases
          - definition [ref=f2e1064]: MariaDB / MySQL · PostgreSQL
          - definition [ref=f2e1065]: Either or both, with phpMyAdmin and phpPgAdmin
        - generic [ref=f2e1066]:
          - term [ref=f2e1067]: Certificates
          - definition [ref=f2e1068]: Let's Encrypt
          - definition [ref=f2e1069]: Automatic issue and renewal, including wildcard certificates
        - generic [ref=f2e1070]:
          - term [ref=f2e1071]: Firewall
          - definition [ref=f2e1072]: iptables · fail2ban · ipset
          - definition [ref=f2e1073]: Brute-force detection and IP list management
    - generic [ref=f2e1075]:
      - generic [ref=f2e1076]:
        - generic [ref=f2e1077]: Requirements
        - list [ref=f2e1078]:
          - listitem [ref=f2e1079]:
            - generic [ref=f2e1081]: Debian
            - generic [ref=f2e1082]: 12 · 11 · 10
          - listitem [ref=f2e1083]:
            - generic [ref=f2e1085]: Ubuntu
            - generic [ref=f2e1086]: 22.04 LTS · 20.04 LTS
      - list [ref=f2e1087]:
        - listitem [ref=f2e1088]: 64-bit only — 32-bit operating systems are not supported.
        - listitem [ref=f2e1089]: Install on a fresh operating system, not alongside an existing stack.
        - listitem [ref=f2e1090]: On a VPS, prefer KVM or LXC. OpenVZ 7 and earlier have known DNS and firewall problems.
